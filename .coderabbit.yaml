# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  # Request changes for blocking findings; approve once the required threads
  # are resolved, the latest commit is reviewed and pre-merge checks pass.
  auto_approvals:
    enabled: true
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
    # Keep reviewing busy PRs: 0 turns off the pause after N reviewed commits.
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    # Generated by scripts (probe, probe-idl, import-wpt, update).
    - "!data/results.json"
    - "!data/idl.json"
    - "!data/wpt.json"
    - "!data/changelog.json"
    - "!website/build/**"
    - "!website/.docusaurus/**"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
  path_instructions:
    - path: "**"
      instructions: |
        - Engine order: warpdom (the maintainer's engine) first, then the others
          alphabetically, in every table, card, list and data file (src/order.mjs).
          Apart from the "maintainer's engine" note next to warpdom, nothing differs
          between engines.
        - Wording must be neutral: describe what each engine does, without
          promotional or disparaging language.
        - data/results.json, data/idl.json, data/wpt.json and data/changelog.json
          are generated by scripts (npm run probe, probe-idl, import-wpt, update);
          flag hand edits to them. data/spec-groups.json is edited by hand: new
          specs need a classification there (test/spec-groups.test.mjs fails
          until they have one), and scripts/update.mjs keeps those edits. Files
          written by website/scripts/generate.mjs are git-ignored and must not be
          committed or edited by hand.
    - path: "probes/**"
      instructions: |
        - Probes are black box: use only the window passed in, and check behavior
          the standard specifies and a browser shows, not one engine's behavior.
        - A workaround is listed only when a common, neutral workaround exists.
chat:
  auto_reply: true
